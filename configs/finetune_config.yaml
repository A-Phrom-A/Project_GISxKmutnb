# Baseline (ViT + SegDecoder) Config
model:
  in_channels: 12
  img_size: 256
  patch_size: 16
  embed_dim: 256
  depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  decoder_embed_dim: 128
  decoder_depth: 2
  decoder_num_heads: 4
  out_channels: 1
  pretrained_path: "checkpoints/mae/mae_best.pth" # Path to MAE weights

training:
  epochs: 100
  batch_size: 16
  lr: 5e-5
  weight_decay: 1e-4
  bce_weight: 0.5
  dice_weight: 0.5
  pos_weight: 4.75  # จาก Phase 1
  threshold: 0.5
  patience: 15
  save_every: 10
  use_amp: true

logging:
  use_wandb: false
  project: "GISxKMUTNB-Baseline"
  run_name: "vit-baseline-v1"
