# MAE Pretraining Config
model:
  in_channels: 12
  img_size: 256
  patch_size: 16
  embed_dim: 256
  depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  mask_ratio: 0.75

training:
  epochs: 100
  batch_size: 16
  lr: 1e-4
  weight_decay: 1e-4
  use_amp: true
  patience: 10
  save_every: 10

logging:
  use_wandb: false
  project: "GISxKMUTNB-MAE"
  run_name: "mae-pretrain-v1"
