[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-kmutnb"
version = "1.0.0"
description = "Multi-Modal Satellite Oil Palm Detection & Radar-Guided Cloud-MAE Library (KMUTNB)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "KMUTNB GIS & Deep Learning Research Team", email = "research@kmutnb.ac.th"}
]
keywords = [
    "remote-sensing",
    "satellite-imagery",
    "deep-learning",
    "vision-transformer",
    "masked-autoencoder",
    "cloud-removal",
    "sentinel-1",
    "sentinel-2",
    "oil-palm",
    "geoai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "fiona>=1.9.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "requests>=2.28.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
]

[project.scripts]
gis-kmutnb = "lib2_vitpalm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib1_fusion*", "lib2_vitpalm*", "lib3_geoai*"]

[tool.pytest.ini_options]
addopts = "-p no:platformdirs"

